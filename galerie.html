<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie photo — Les Vieux Loups de l'EHPAD</title>
<link rel="icon" type="image/png" href="assets/logo-vieux-loups.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Special+Elite&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0A0A14; --nuit-2:#12101E; --carte:#171427;
  --magenta:#E31FBF; --violet:#8B3FE8; --craie:#E8E2D5; --gris:#9B94AC;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--nuit);color:var(--craie);font-family:'Barlow',sans-serif;line-height:1.6;min-height:100vh}
.display{font-family:'Rubik Dirt',cursive;letter-spacing:.02em}
img{max-width:100%;display:block}
a{text-decoration:none}
.conteneur{max-width:1100px;margin:0 auto;padding:0 20px}
a:focus-visible,button:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}

nav{position:sticky;top:0;z-index:50;background:rgba(10,10,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(139,63,232,.3)}
nav .conteneur{display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-marque{display:flex;align-items:center;gap:10px;color:var(--craie)}
.nav-marque img{width:42px;height:42px}
.nav-marque span{font-family:'Rubik Dirt',cursive;font-size:1.05rem}
.retour{color:var(--gris);font-weight:600;font-size:.95rem;transition:color .2s}
.retour:hover{color:var(--magenta)}

header.hero-page{text-align:center;padding:70px 20px 40px}
header.hero-page img{width:110px;height:110px;margin:0 auto 18px;filter:drop-shadow(0 0 20px rgba(227,31,191,.5))}
header.hero-page h1{font-size:clamp(2rem,5vw,3.2rem);text-shadow:0 0 24px rgba(227,31,191,.5)}
header.hero-page h1 .rose{color:var(--magenta)}
header.hero-page p{color:var(--gris);font-family:'Special Elite',monospace;margin-top:12px}

.grille-galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:20px 0 80px}
.carte-photo{
  position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;cursor:zoom-in;
  background:var(--carte);border:1px solid rgba(139,63,232,.35);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.carte-photo:hover{transform:translateY(-4px);border-color:var(--magenta);box-shadow:0 14px 40px rgba(227,31,191,.2)}
.carte-photo img{width:100%;height:100%;object-fit:cover}
.carte-photo .legende{
  position:absolute;left:0;right:0;bottom:0;padding:10px 12px 8px;
  background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);
  font-size:.82rem;color:var(--gris);opacity:0;transition:opacity .2s;
}
.carte-photo .texte-legende{color:var(--craie);font-weight:600;font-size:.9rem}
.carte-photo .btn-supprimer{
  position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;
  background:rgba(6,6,12,.7);border:1px solid rgba(227,31,191,.5);color:var(--craie);
  cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s,background .2s;
}
.carte-photo:hover .btn-supprimer{opacity:1}
.carte-photo .btn-supprimer:hover{background:#C0392B;border-color:#C0392B}
.carte-photo:hover .legende{opacity:1}

/* Album (plusieurs photos postées ensemble) */
.carte-photo.album{
  box-shadow:
    6px 6px 0 -2px var(--nuit), 6px 6px 0 -1px rgba(139,63,232,.35),
    12px 12px 0 -4px var(--nuit), 12px 12px 0 -3px rgba(139,63,232,.22);
}
.badge-album{
  position:absolute;top:8px;right:8px;z-index:2;
  background:rgba(6,6,12,.75);border:1px solid rgba(227,31,191,.55);
  color:var(--craie);font-size:.78rem;font-weight:700;
  padding:4px 10px;border-radius:20px;pointer-events:none;
}

/* Lightbox : navigation, compteur, suppression */
.lightbox-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:46px;height:46px;border-radius:50%;
  background:rgba(6,6,12,.65);border:1px solid rgba(227,31,191,.5);color:var(--craie);
  font-size:1.5rem;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.lightbox-nav:hover{background:rgba(139,63,232,.5)}
.lightbox-prec{left:16px}
.lightbox-suiv{right:16px}
.lightbox-compteur{
  position:absolute;top:24px;left:50%;transform:translateX(-50%);
  color:var(--gris);font-family:'Special Elite',monospace;font-size:.85rem;
}
.lightbox-supprimer{
  position:absolute;top:20px;left:28px;background:none;border:none;
  color:var(--craie);font-size:1.25rem;cursor:pointer;opacity:.85;
}
.lightbox-supprimer:hover{opacity:1;color:var(--magenta)}

.vide{text-align:center;padding:80px 20px;color:var(--gris)}
.vide h2{font-family:'Rubik Dirt',cursive;color:var(--magenta);margin-bottom:12px}

/* Lightbox */
.lightbox{
  position:fixed;inset:0;background:rgba(6,6,12,.94);display:none;
  align-items:center;justify-content:center;z-index:100;padding:40px 20px;cursor:zoom-out;
}
.lightbox.ouvert{display:flex}
.lightbox img{max-width:min(92vw,900px);max-height:82vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lightbox .legende-lb{position:absolute;bottom:28px;left:0;right:0;text-align:center;color:var(--gris);font-family:'Special Elite',monospace;font-size:.9rem}
.lightbox-fermer{position:absolute;top:22px;right:28px;font-size:1.8rem;color:var(--craie);background:none;border:none;cursor:pointer}

footer{background:#07070F;border-top:1px solid rgba(139,63,232,.3);padding:30px 0;text-align:center;color:#5A536B;font-family:'Special Elite',monospace;font-size:.85rem}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<nav>
  <div class="conteneur">
    <a href="index.html" class="nav-marque">
      <img src="assets/logo-vieux-loups.png" alt="Logo Les Vieux Loups">
      <span>Les Vieux Loups</span>
    </a>
    <a href="index.html" class="retour">← Retour au site</a>
  </div>
</nav>

<header class="hero-page">
  <img src="assets/logo-vieux-loups.png" alt="">
  <h1 class="display">Galerie <span class="rose">photo</span></h1>
  <p>Les meilleurs souvenirs de la meute, postés direct depuis Discord</p>
</header>

<main class="conteneur">
  <div class="grille-galerie" id="grilleGalerie"></div>
  <div class="vide" id="messageVide" hidden>
    <h2>🖼️ La galerie est vide pour l'instant</h2>
    <p>Les prochaines photos postées sur Discord apparaîtront ici automatiquement.</p>
  </div>
</main>

<div class="lightbox" id="lightbox">
  <button class="lightbox-supprimer" id="supprimerLightbox" title="Supprimer cette photo" aria-label="Supprimer cette photo">🗑️</button>
  <div class="lightbox-compteur" id="lightboxCompteur" hidden></div>
  <button class="lightbox-fermer" id="fermerLightbox" aria-label="Fermer">✕</button>
  <button class="lightbox-nav lightbox-prec" id="lightboxPrec" aria-label="Photo précédente" hidden>‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-suiv" id="lightboxSuiv" aria-label="Photo suivante" hidden>›</button>
  <div class="legende-lb" id="lightboxLegende"></div>
</div>

<footer>
  © 2026 Les Vieux Loups de l'EHPAD — On mord encore. 🐺
</footer>

<script src="galerie.js"></script>
<script>
function formaterDate(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch { return ''; }
}

function echapperHTML(txt) {
  const div = document.createElement('div');
  div.textContent = txt || '';
  return div.innerHTML;
}

// Regroupe les photos par album (même id = postées dans le même message Discord).
// Les photos sans album restent seules dans leur propre groupe.
function grouperParAlbum(photos) {
  const groupes = [];
  const index = new Map();
  for (const p of photos) {
    if (p.album) {
      let g = index.get(p.album);
      if (!g) {
        g = { photos: [] };
        index.set(p.album, g);
        groupes.push(g);
      }
      g.photos.push(p);
    } else {
      groupes.push({ photos: [p] });
    }
  }
  return groupes;
}

function creerCarte(groupe) {
  const carte = document.createElement('div');
  const estAlbum = groupe.photos.length > 1;
  carte.className = 'carte-photo' + (estAlbum ? ' album' : '');
  majCarte(carte, groupe);
  carte.addEventListener('click', () => ouvrirLightbox(groupe, 0));
  groupe.carte = carte;
  return carte;
}

// (Re)construit le contenu visuel d'une carte à partir de la 1ère photo du groupe.
function majCarte(carte, groupe) {
  const p = groupe.photos[0];
  const auteurSafe = echapperHTML(p.auteur || 'Membre');
  const legendeSafe = echapperHTML(p.legende || '');
  const legendeTexte = legendeSafe ? `<span class="texte-legende">${legendeSafe}</span><br>` : '';
  const badge = groupe.photos.length > 1 ? `<div class="badge-album">🗂️ ${groupe.photos.length}</div>` : '';
  carte.innerHTML = `
    ${badge}
    <img src="${p.url}" alt="${legendeSafe || 'Photo postée par ' + auteurSafe}" loading="lazy">
    <div class="legende">${legendeTexte}📸 ${auteurSafe} · ${formaterDate(p.date)}</div>
  `;
  carte.classList.toggle('album', groupe.photos.length > 1);
}

// onSuccess est appelé après une suppression confirmée côté serveur.
async function demanderSuppression(photoUrl, onSuccess) {
  const motDePasse = prompt('Mot de passe pour supprimer cette photo :');
  if (motDePasse === null) return; // annulé

  try {
    const rep = await fetch('/api/galerie-supprimer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ motDePasse, photoUrl })
    });
    const data = await rep.json();

    if (data.ok) {
      onSuccess();
    } else {
      alert('❌ ' + (data.erreur || 'Suppression impossible.'));
    }
  } catch {
    alert('❌ Erreur réseau, réessaie plus tard.');
  }
}

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxLegende = document.getElementById('lightboxLegende');
const lightboxCompteur = document.getElementById('lightboxCompteur');
const lightboxPrec = document.getElementById('lightboxPrec');
const lightboxSuiv = document.getElementById('lightboxSuiv');
const supprimerLightbox = document.getElementById('supprimerLightbox');

let groupeCourant = null;
let indexCourant = 0;

function ouvrirLightbox(groupe, index) {
  groupeCourant = groupe;
  indexCourant = index;
  afficherPhotoCourante();
  lightbox.classList.add('ouvert');
}

function afficherPhotoCourante() {
  const p = groupeCourant.photos[indexCourant];
  lightboxImg.src = p.url;
  const legendeSafe = echapperHTML(p.legende || '');
  const auteurSafe = echapperHTML(p.auteur || 'Membre');
  lightboxLegende.innerHTML = (legendeSafe ? `${legendeSafe}<br>` : '') + `📸 ${auteurSafe} · ${formaterDate(p.date)}`;
  const multi = groupeCourant.photos.length > 1;
  lightboxPrec.hidden = !multi;
  lightboxSuiv.hidden = !multi;
  lightboxCompteur.hidden = !multi;
  if (multi) lightboxCompteur.textContent = `${indexCourant + 1} / ${groupeCourant.photos.length}`;
}

function photoPrecedente() {
  if (!groupeCourant) return;
  indexCourant = (indexCourant - 1 + groupeCourant.photos.length) % groupeCourant.photos.length;
  afficherPhotoCourante();
}
function photoSuivante() {
  if (!groupeCourant) return;
  indexCourant = (indexCourant + 1) % groupeCourant.photos.length;
  afficherPhotoCourante();
}
function fermerLightbox() {
  lightbox.classList.remove('ouvert');
  lightboxImg.src = '';
  groupeCourant = null;
}

lightbox.addEventListener('click', (e) => { if (e.target === lightbox) fermerLightbox(); });
document.getElementById('fermerLightbox').addEventListener('click', fermerLightbox);
lightboxPrec.addEventListener('click', (e) => { e.stopPropagation(); photoPrecedente(); });
lightboxSuiv.addEventListener('click', (e) => { e.stopPropagation(); photoSuivante(); });
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('ouvert')) return;
  if (e.key === 'Escape') fermerLightbox();
  if (e.key === 'ArrowLeft') photoPrecedente();
  if (e.key === 'ArrowRight') photoSuivante();
});

supprimerLightbox.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!groupeCourant) return;
  const p = groupeCourant.photos[indexCourant];
  demanderSuppression(p.url, () => {
    groupeCourant.photos.splice(indexCourant, 1);

    if (!groupeCourant.photos.length) {
      // Plus aucune photo dans ce groupe : on retire la carte de la grille.
      groupeCourant.carte.remove();
      fermerLightbox();
      if (!grille.children.length) {
        grille.hidden = true;
        vide.hidden = false;
      }
      return;
    }

    // Il reste des photos : on met à jour la vignette (badge, aperçu) et on
    // affiche la photo suivante (ou la dernière si on supprimait la dernière).
    majCarte(groupeCourant.carte, groupeCourant);
    if (indexCourant >= groupeCourant.photos.length) indexCourant = groupeCourant.photos.length - 1;
    afficherPhotoCourante();
  });
});

const grille = document.getElementById('grilleGalerie');
const vide = document.getElementById('messageVide');

if (typeof GALERIE !== 'undefined' && GALERIE.length) {
  grouperParAlbum(GALERIE).forEach(groupe => grille.appendChild(creerCarte(groupe)));
} else {
  grille.hidden = true;
  vide.hidden = false;
}
</script>
</body>
</html>
