<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos opérations — Les Vieux Loups de l'EHPAD</title>
<meta name="description" content="Les coups de la meute des Vieux Loups de l'EHPAD, immortalisés.">
<link rel="icon" type="image/png" href="assets/logo-vieux-loups.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Special+Elite&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0A0A14; --nuit-2:#12101E; --carte:#171427;
  --magenta:#E31FBF; --violet:#8B3FE8; --craie:#E8E2D5; --gris:#9B94AC;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--nuit);color:var(--craie);font-family:'Barlow',sans-serif;line-height:1.6;min-height:100vh}
.display{font-family:'Rubik Dirt',cursive;letter-spacing:.02em}
img{max-width:100%;display:block}
a{text-decoration:none}
.conteneur{max-width:1100px;margin:0 auto;padding:0 20px}
a:focus-visible,button:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}

nav{position:sticky;top:0;z-index:50;background:rgba(10,10,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(139,63,232,.3)}
nav .conteneur{display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-marque{display:flex;align-items:center;gap:10px;color:var(--craie)}
.nav-marque img{width:42px;height:42px}
.nav-marque span{font-family:'Rubik Dirt',cursive;font-size:1.05rem}
.retour{color:var(--gris);font-weight:600;font-size:.95rem;transition:color .2s}
.retour:hover{color:var(--magenta)}

header.hero-page{text-align:center;padding:70px 20px 30px}
header.hero-page img{width:110px;height:110px;margin:0 auto 18px;filter:drop-shadow(0 0 20px rgba(227,31,191,.5))}
header.hero-page h1{font-size:clamp(2rem,5vw,3.2rem);text-shadow:0 0 24px rgba(227,31,191,.5)}
header.hero-page h1 .rose{color:var(--magenta)}
header.hero-page p{color:var(--gris);font-family:'Special Elite',monospace;margin-top:12px}

/* Grille des opérations */
.grille-operations{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding:20px 0 80px;
}
.ops-vide{grid-column:1/-1;text-align:center;color:var(--gris);font-family:'Special Elite',monospace;padding:60px 0}
.op-carte{
  position:relative;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;
  border:1px solid rgba(139,63,232,.3);background:rgba(139,63,232,.08);
  transition:transform .25s,box-shadow .25s,border-color .25s;
}
.op-carte:hover{transform:translateY(-6px);border-color:var(--magenta);box-shadow:0 16px 44px rgba(227,31,191,.28)}
.op-carte-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.op-carte-vide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;opacity:.5}
.op-carte-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;
  background:linear-gradient(to top,rgba(10,10,20,.92) 0%,rgba(10,10,20,.4) 55%,transparent 100%);
}
.op-carte-titre{font-family:'Rubik Dirt','Special Elite',cursive;color:#fff;font-size:1.15rem;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.op-carte-badge{
  position:absolute;top:10px;right:10px;background:var(--magenta);color:#fff;
  font-family:'Special Elite',monospace;font-size:.72rem;padding:3px 9px;border-radius:20px;
}

/* Modale détail */
.op-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.op-modal.ouvert{display:flex}
.op-modal-fond{position:absolute;inset:0;background:rgba(5,5,12,.85);backdrop-filter:blur(4px)}
.op-modal-boite{
  position:relative;z-index:1;max-width:660px;width:100%;max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,#141024,#0e0b18);border:1px solid rgba(139,63,232,.4);border-radius:18px;padding:28px;
  box-shadow:0 24px 70px rgba(227,31,191,.25);
}
.op-modal-fermer{
  position:absolute;top:14px;right:14px;background:rgba(227,31,191,.15);border:1px solid rgba(227,31,191,.4);
  color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem;transition:background .2s;
}
.op-modal-fermer:hover{background:var(--magenta)}
.op-modal-boite h2{font-family:'Rubik Dirt','Special Elite',cursive;color:#fff;font-size:1.7rem;margin:0 40px 4px 0}
.op-modal-date{color:var(--gris);font-family:'Special Elite',monospace;font-size:.82rem;margin-bottom:18px}
.op-modal-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.op-modal-photos img{width:100%;border-radius:10px;cursor:pointer;transition:transform .2s;aspect-ratio:4/3;object-fit:cover}
.op-modal-photos img:hover{transform:scale(1.03)}
.op-modal-desc{color:var(--craie);line-height:1.65;margin-bottom:18px;white-space:pre-wrap}
.op-modal-participants{display:flex;flex-wrap:wrap;gap:8px}
.op-parti-tag{
  background:rgba(139,63,232,.18);border:1px solid rgba(139,63,232,.4);color:#d9b8ff;
  font-family:'Special Elite',monospace;font-size:.8rem;padding:4px 12px;border-radius:20px;
}
</style>
</head>
<body>

<nav>
  <div class="conteneur">
    <a class="nav-marque" href="index.html">
      <img src="assets/logo-vieux-loups.png" alt="">
      <span>Les Vieux Loups</span>
    </a>
    <a class="retour" href="index.html">← Retour à l'accueil</a>
  </div>
</nav>

<header class="hero-page">
  <img src="assets/logo-vieux-loups.png" alt="">
  <h1 class="display">Nos <span class="rose">opérations</span></h1>
  <p>— Les coups de la meute, immortalisés —</p>
</header>

<main class="conteneur">
  <div id="grille-operations" class="grille-operations">
    <p id="ops-vide" class="ops-vide">Aucune opération enregistrée pour le moment. Ça ne saurait tarder... 🐺</p>
  </div>
</main>

<!-- Fenêtre détail d'une opération -->
<div id="op-modal" class="op-modal" aria-hidden="true">
  <div class="op-modal-fond"></div>
  <div class="op-modal-boite">
    <button class="op-modal-fermer" aria-label="Fermer">✕</button>
    <h2 id="op-modal-titre"></h2>
    <p id="op-modal-date" class="op-modal-date"></p>
    <div id="op-modal-photos" class="op-modal-photos"></div>
    <p id="op-modal-desc" class="op-modal-desc"></p>
    <div id="op-modal-participants" class="op-modal-participants"></div>
  </div>
</div>

<script src="operations.js"></script>
<script>
(function(){
  const grille = document.getElementById('grille-operations');
  if (!grille) return;

  function echapper(s){
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatDate(ts){
    try { return new Date(ts).toLocaleDateString('fr-FR', {day:'2-digit',month:'long',year:'numeric'}); }
    catch(e){ return ''; }
  }

  function afficher(operations){
    const vide = document.getElementById('ops-vide');
    if (!operations || !operations.length){ if (vide) vide.style.display='block'; return; }
    if (vide) vide.style.display='none';

    operations.forEach(op => {
      const carte = document.createElement('div');
      carte.className = 'op-carte';
      const photo0 = (op.photos && op.photos[0]) ? op.photos[0] : null;
      carte.innerHTML =
        (photo0 ? `<img class="op-carte-img" src="${echapper(photo0)}" alt="" loading="lazy">` : `<div class="op-carte-vide">🎯</div>`) +
        (op.photos && op.photos.length > 1 ? `<span class="op-carte-badge">📸 ${op.photos.length}</span>` : '') +
        `<div class="op-carte-overlay"><div class="op-carte-titre">${echapper(op.titre)}</div></div>`;
      carte.addEventListener('click', () => ouvrirModale(op));
      grille.appendChild(carte);
    });
  }

  const modal = document.getElementById('op-modal');
  const mTitre = document.getElementById('op-modal-titre');
  const mDate = document.getElementById('op-modal-date');
  const mPhotos = document.getElementById('op-modal-photos');
  const mDesc = document.getElementById('op-modal-desc');
  const mParti = document.getElementById('op-modal-participants');

  function ouvrirModale(op){
    mTitre.textContent = op.titre || 'Opération';
    mDate.textContent = op.date ? '📅 ' + formatDate(op.date) : '';
    mDesc.textContent = op.description || '';
    mPhotos.innerHTML = '';
    (op.photos || []).forEach(url => {
      const img = document.createElement('img');
      img.src = url; img.alt = ''; img.loading = 'lazy';
      img.addEventListener('click', () => window.open(url, '_blank'));
      mPhotos.appendChild(img);
    });
    mPhotos.style.display = (op.photos && op.photos.length) ? 'grid' : 'none';
    mParti.innerHTML = '';
    if (op.participants && op.participants.length){
      const label = document.createElement('span');
      label.className = 'op-parti-tag'; label.textContent = '🐺 Avec :';
      mParti.appendChild(label);
      op.participants.forEach(p => {
        const tag = document.createElement('span');
        tag.className = 'op-parti-tag'; tag.textContent = p;
        mParti.appendChild(tag);
      });
    }
    modal.classList.add('ouvert');
    modal.setAttribute('aria-hidden', 'false');
  }

  function fermer(){ modal.classList.remove('ouvert'); modal.setAttribute('aria-hidden','true'); }
  modal.querySelector('.op-modal-fermer').addEventListener('click', fermer);
  modal.querySelector('.op-modal-fond').addEventListener('click', fermer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fermer(); });

  // OPERATIONS vient de operations.js
  afficher(typeof OPERATIONS !== 'undefined' ? OPERATIONS : []);
})();
</script>
</body>
</html>
